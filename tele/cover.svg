<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="2.2" fill="#1f2440" fill-opacity=".13"/></pattern>
    <g id="page">
      <rect x="-98" y="-118" width="196" height="236" rx="16" fill="#1f2440" fill-opacity=".3" transform="translate(8 9)"/>
      <rect x="-98" y="-118" width="196" height="236" rx="16" fill="#fffaf0" stroke="#1f2440" stroke-width="6"/>
      <g fill="#1f2440"><circle cx="-60" cy="-100" r="5"/><circle cx="-20" cy="-100" r="5"/><circle cx="20" cy="-100" r="5"/><circle cx="60" cy="-100" r="5"/></g>
    </g>
  </defs>
  <rect width="800" height="500" fill="#ffd23f"/><rect width="800" height="500" fill="url(#dots)"/>
  <!-- the phone cord tying the pages together -->
  <path d="M40 440c30-40 50 30 80-10s50 30 80-10 50 30 80-10 50 30 80-10 50 30 80-10 50 30 80-10 50 30 80-10 50 30 80-10 50 20 70-6" fill="none" stroke="#1f2440" stroke-width="7" stroke-linecap="round"/>
  <!-- page 1: a cat -->
  <g transform="translate(150 232) rotate(-7)">
    <use href="#page"/>
    <g fill="none" stroke="#1f2440" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-52 -6c0-40 104-40 104 0 0 60-10 82-52 82s-52-22-52-82z" fill="#ff9f43"/>
      <path d="M-50-14l-6-50 40 26m66 24l6-50-40 26" fill="#ff9f43"/>
      <path d="M-22 10v10m44-10v10"/><path d="M-8 34q8 8 16 0"/><path d="M-70 26l34 6m-34 14l34-4m106-16l-34 6m34 14l-34-4"/>
    </g>
    <path d="M0 24l-6-7h12z" fill="#ff5d73" stroke="#1f2440" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- arrow -->
  <g fill="none" stroke="#1f2440" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M266 150q28-26 54-8"/><path d="M300 128l22 14-14 22"/>
    <path d="M500 330q28 22 52 2"/><path d="M534 348l20-18-20-14"/>
  </g>
  <!-- page 2: somebody's guess -->
  <g transform="translate(400 250) rotate(4)">
    <use href="#page"/>
    <path d="M-30-30c0-44 62-44 62-6 0 30-32 26-32 56" fill="none" stroke="#ff5d73" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="56" r="11" fill="#ff5d73"/>
    <path d="M-62 88c14-10 22 10 36 0s22 10 36 0 22 10 36 0 12 2 18 4" fill="none" stroke="#1f2440" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- page 3: the cat is now a lion-ish sun -->
  <g transform="translate(650 232) rotate(-4)">
    <use href="#page"/>
    <g fill="none" stroke="#1f2440" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0-66l14 26 28-14-2 30 30 2-16 26 24 18-28 12 10 28-30-4-6 30-24-18-24 18-6-30-30 4 10-28-28-12 24-18-16-26 30-2-2-30 28 14z" fill="#3ddc97"/>
      <circle cx="0" cy="6" r="36" fill="#fffaf0"/>
      <path d="M-14-2v8m28-8v8"/><path d="M-14 20q14 14 28 0"/>
    </g>
  </g>
  <!-- handset -->
  <g transform="translate(668 84) rotate(14)" fill="none" stroke-linecap="round">
    <path d="M-52 16q52-56 104 0" stroke="#1f2440" stroke-width="34"/>
    <rect x="-78" y="2" width="50" height="38" rx="14" fill="#ff5d73" stroke="#1f2440" stroke-width="6" transform="rotate(-38 -53 21)"/>
    <rect x="28" y="2" width="50" height="38" rx="14" fill="#ff5d73" stroke="#1f2440" stroke-width="6" transform="rotate(38 53 21)"/>
    <path d="M-52 16q52-56 104 0" stroke="#ff5d73" stroke-width="22"/>
  </g>
</svg>
