<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1d7a5f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Spoons" />
    <title>Spoons</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-phase="join">
    <!-- ---- join -->
    <main id="join">
      <h1 class="logo" aria-label="Spoons">
        <span class="logo-a">Spoons</span>
      </h1>
      <p class="tagline">Pass fast. Collect four. Grab a spoon!</p>

      <div id="demo" class="demo" aria-hidden="true"></div>

      <form id="join-form" class="sheet spiral join-card" autocomplete="off">
        <label for="name">What do they call you?</label>
        <input id="name" type="text" placeholder="Your name" autocapitalize="words" spellcheck="false" enterkeyhint="go" />
        <button class="btn primary big" type="submit">Pull up a chair</button>
        <button id="watch" class="btn" type="button">Just watch (for a TV)</button>
        <p id="join-error" class="error" role="alert"></p>
      </form>
      <p class="fineprint">3 to 8 players · one screen each · slowpokes will be heckled</p>
    </main>

    <div id="connecting" hidden>
      <div class="pencil-spin">♠</div>
      <p>Finding the table…</p>
    </div>

    <!-- ---- game shell -->
    <div id="game" hidden>
      <header id="top">
        <span class="logo mini" aria-hidden="true"><span class="logo-a">Spoons</span></span>
        <span id="progress"></span>
        <span class="spacer"></span>
        <span id="conn" class="conn" hidden></span>
        <button id="mute" class="icon-btn" type="button" aria-label="Sound"></button>
        <button id="menu" class="icon-btn" type="button" aria-label="Menu">☰</button>
        <div id="menu-pop" hidden>
          <button id="end-game" type="button">End game for everyone</button>
          <button id="rename" type="button">Change name</button>
          <button id="leave" type="button">Leave</button>
        </div>
      </header>
      <div id="screen"></div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
