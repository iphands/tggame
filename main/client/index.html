<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141736" />
    <title>Game Night</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="fonts/chewy.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/patrick-hand.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <h1 class="logo" aria-label="Game Night">
        <span class="word" aria-hidden="true"><i>G</i><i>a</i><i>m</i><i>e</i></span>
        <span class="word" aria-hidden="true"><i>N</i><i>i</i><i>g</i><i>h</i><i>t</i></span>
      </h1>
      <p class="lede">Tap a game. Jump in.</p>
      <p class="tally" id="tally" aria-live="polite">Checking who's around…</p>
    </header>

    <main class="shelf" id="shelf" aria-busy="true">
      <div class="card ghost"></div>
      <div class="card ghost"></div>
    </main>

    <p class="empty" id="empty" hidden>No games here yet. Add a <code>game.json</code> to a game folder and it shows up.</p>
    <div class="toast" id="toast" role="status" hidden></div>
    <noscript><p class="empty">This page needs JavaScript to find the games.</p></noscript>

    <script type="module" src="app.js"></script>
  </body>
</html>
