<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="night" cx=".5" cy=".45" r=".8"><stop offset="0" stop-color="#3a2f5c"/><stop offset=".6" stop-color="#1d1a2b"/><stop offset="1" stop-color="#0c0a14"/></radialGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".85"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#night)"/>
  <!-- floorboards -->
  <g stroke="#0c0a14" stroke-opacity=".35" stroke-width="3">
    <path d="M0 120H800M0 200H800M0 280H800M0 360H800M0 440H800"/>
  </g>
  <!-- a wall with a doorway -->
  <rect x="430" y="0" width="46" height="190" fill="#4a3f6b" stroke="#0c0a14" stroke-width="7"/>
  <rect x="430" y="330" width="46" height="170" fill="#4a3f6b" stroke="#0c0a14" stroke-width="7"/>
  <!-- lamp light round the cousin -->
  <circle cx="230" cy="290" r="210" fill="url(#lamp)"/>
  <!-- the cousin, running -->
  <g transform="translate(230 290) rotate(-8)">
    <ellipse cx="6" cy="62" rx="56" ry="14" fill="#0c0a14" fill-opacity=".4"/>
    <circle r="62" fill="#3ddc97" stroke="#1f1a2e" stroke-width="8"/>
    <path d="M-58 14h116M-50 34h100" stroke="#1f1a2e" stroke-opacity=".35" stroke-width="9"/>
    <path d="M-46-42q46-52 92 0z" fill="#ff5d73" stroke="#1f1a2e" stroke-width="8" stroke-linejoin="round"/>
    <circle cy="-76" r="13" fill="#f4ecd8" stroke="#1f1a2e" stroke-width="7"/>
    <circle cx="-30" cy="-8" r="15" fill="#fff" stroke="#1f1a2e" stroke-width="6"/>
    <circle cx="8" cy="-8" r="15" fill="#fff" stroke="#1f1a2e" stroke-width="6"/>
    <circle cx="-36" cy="-8" r="6" fill="#1f1a2e"/>
    <circle cx="2" cy="-8" r="6" fill="#1f1a2e"/>
    <ellipse cx="-12" cy="24" rx="9" ry="12" fill="#1f1a2e"/>
  </g>
  <!-- the beast, coming through the doorway -->
  <g transform="translate(590 250)">
    <ellipse cx="0" cy="104" rx="100" ry="20" fill="#0c0a14" fill-opacity=".5"/>
    <path d="M-52-70l-34-62 62 34zM52-70l34-62-62 34z" fill="#f4ecd8" stroke="#0c0a14" stroke-width="8" stroke-linejoin="round"/>
    <path d="M0-100l22 16 26-10 8 26 28 4-6 28 22 18-18 22 12 26-26 10-2 28-28-4-14 24-24-16-24 16-14-24-28 4-2-28-26-10 12-26-18-22 22-18-6-28 28-4 8-26 26 10z" fill="#5b3f8f" stroke="#0c0a14" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="-34" cy="-18" r="20" fill="#ffd23f" stroke="#0c0a14" stroke-width="7"/>
    <circle cx="34" cy="-18" r="20" fill="#ffd23f" stroke="#0c0a14" stroke-width="7"/>
    <ellipse cx="-38" cy="-18" rx="6" ry="13" fill="#0c0a14"/>
    <ellipse cx="30" cy="-18" rx="6" ry="13" fill="#0c0a14"/>
    <path d="M-48 30q48 44 96 0q-48 16-96 0z" fill="#0c0a14" stroke="#0c0a14" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-34 34l8 16 9-14 9 16 8-16 8 16 9-16 9 14 8-16" fill="none" stroke="#f4ecd8" stroke-width="6" stroke-linejoin="round"/>
  </g>
  <!-- an energy pill on the floor -->
  <g transform="translate(120 420) rotate(-30)">
    <rect x="-34" y="-15" width="68" height="30" rx="15" fill="#f4ecd8" stroke="#0c0a14" stroke-width="6"/>
    <path d="M0-15h19a15 15 0 0 1 0 30H0z" fill="#ffd23f" stroke="#0c0a14" stroke-width="6"/>
  </g>
</svg>
