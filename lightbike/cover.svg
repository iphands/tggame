<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="floor" cx=".5" cy=".45" r=".8"><stop offset="0" stop-color="#1b1048"/><stop offset=".6" stop-color="#0d0729"/><stop offset="1" stop-color="#07041a"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6d5bd0" stroke-opacity=".28" stroke-width="2"/></pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#floor)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- the lines, once blurred for the glow and once sharp -->
    <g filter="url(#glow)" stroke-width="18" stroke-opacity=".8">
      <path d="M-20 380H220V140H500" stroke="#3de0e0"/>
      <path d="M820 100H620V300H380V460" stroke="#ff6bcb"/>
      <path d="M100 -20V60H340V260H540" stroke="#ffc23d"/>
    </g>
    <g stroke-width="9">
      <path d="M-20 380H220V140H500" stroke="#3de0e0"/>
      <path d="M820 100H620V300H380V460" stroke="#ff6bcb"/>
      <path d="M100 -20V60H340V260H540" stroke="#ffc23d"/>
    </g>
    <g stroke-width="3" stroke="#fff" stroke-opacity=".85">
      <path d="M-20 380H220V140H500"/>
      <path d="M820 100H620V300H380V460"/>
      <path d="M100 -20V60H340V260H540"/>
    </g>
  </g>
  <!-- the bikes at the front of each line -->
  <g stroke="#07041a" stroke-width="4" stroke-linejoin="round">
    <path d="M492 124h34l16 16-16 16h-34z" fill="#eaffff"/>
    <path d="M364 452v34l16 16 16-16v-34z" fill="#ffe6f6"/>
    <path d="M532 244h34l16 16-16 16h-34z" fill="#fff3d2"/>
  </g>
  <!-- the yellow one is about to have a bad day -->
  <g stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M596 236l16-12M600 260h22M596 284l16 12"/></g>
  <g transform="rotate(-4 400 60)">
    <rect x="212" y="18" width="376" height="80" rx="14" fill="#07041a" stroke="#3de0e0" stroke-width="5"/>
    <text x="400" y="78" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-style="italic" font-weight="800" font-size="56" letter-spacing="3" text-anchor="middle" fill="#f1ecff">LIGHTBIKES</text>
  </g>
</svg>
