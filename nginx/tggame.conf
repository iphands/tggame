# Game Night behind nginx: play.ahands.org -> the tggame container on localhost:8082.
# Lives in /etc/nginx/conf.d/. After a change: nginx -t && systemctl reload nginx

# Every game talks to its server over a WebSocket, so the upgrade must be passed through.
# Remove this block if another file in conf.d already defines $connection_upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name play.ahands.org;

    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy
server {
    # the listen and TLS settings shared by every site on this machine
    include /etc/nginx/common.conf;

    server_name play.ahands.org;

    ssl_certificate /etc/letsencrypt/live/play.ahands.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.ahands.org/privkey.pem;

    location / {
        # without these three the selector page loads but no game can be joined
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # a quiet lobby sends nothing; the default 60 s would drop everyone once a minute
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_pass http://localhost:8082;
    }
}
