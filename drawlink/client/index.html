<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#2b59c3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Drawlink" />
    <title>Drawlink</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-phase="join">
    <!-- ---- join -->
    <main id="join">
      <h1 class="logo" aria-label="Drawlink">
        <span class="logo-a">Draw</span>
        <span class="logo-b">link</span>
      </h1>
      <p class="tagline">One draws. Everyone guesses. Fastest wins.</p>

      <div class="demo" aria-hidden="true">
        <div class="demo-paper">
          <svg viewBox="0 0 120 90" fill="none" stroke="#1f2440" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
            <path class="ink" pathLength="1" d="M36 40c-2-10-1-19 2-24 5 3 9 7 12 12 6-2 14-2 20 0 3-5 7-9 12-12 3 5 4 14 2 24 4 8 3 20-6 27-10 8-28 8-38 0-9-7-9-19-4-27z" />
            <path class="ink" pathLength="1" style="--d: 0.9s" d="M49 48v4M71 48v4M57 59c2 2 4 2 6 0M60 57v2" />
            <path class="ink" pathLength="1" style="--d: 1.3s" stroke="#ff5d73" d="M30 55l-14-3M30 60l-14 3M90 55l14-3M90 60l14 3" />
          </svg>
        </div>
        <span class="demo-arrow">➜</span>
        <div class="demo-note alt" style="--tilt: 3deg">cat! +110</div>
      </div>

      <form id="join-form" class="sheet spiral join-card" autocomplete="off">
        <label for="name">What do they call you?</label>
        <input id="name" type="text" placeholder="Your name" autocapitalize="words" spellcheck="false" enterkeyhint="go" />
        <button class="btn primary big" type="submit">Grab a marker</button>
        <button id="watch" class="btn" type="button">Just watch (for a TV)</button>
        <p id="join-error" class="error" role="alert"></p>
      </form>
      <p class="fineprint">3 to 16 players · one screen each · no drawing skills required</p>
    </main>

    <div id="connecting" hidden>
      <div class="pencil-spin">✎</div>
      <p>Finding the table…</p>
    </div>

    <!-- ---- game shell -->
    <div id="game" hidden>
      <header id="top">
        <span class="logo mini" aria-hidden="true"><span class="logo-a">Draw</span><span class="logo-b">link</span></span>
        <span id="progress"></span>
        <span class="spacer"></span>
        <span id="conn" class="conn" hidden></span>
        <button id="mute" class="icon-btn" type="button" aria-label="Sound"></button>
        <button id="menu" class="icon-btn" type="button" aria-label="Menu">☰</button>
        <div id="menu-pop" hidden>
          <button id="end-game" type="button">End game for everyone</button>
          <button id="rename" type="button">Change name</button>
          <button id="leave" type="button">Leave</button>
        </div>
      </header>
      <div id="screen"></div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
